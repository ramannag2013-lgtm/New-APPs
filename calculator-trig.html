<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUMANTH Trig Calculator</title>
<style>
body{text-align:center;font-family:Arial;background:#fff3e0;padding:15px;}
h1{font-size:28px;}
.calc{background:white;width:300px;margin:auto;padding:18px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,0.2);}
#display{width:100%;height:55px;font-size:26px;text-align:right;border:2px solid #ff9800;border-radius:10px;padding:5px;margin-bottom:12px;box-sizing:border-box;}
.row{display:flex;justify-content:space-between;margin-bottom:8px;gap:5px;}
button{flex:1;height:50px;font-size:18px;font-weight:bold;border:none;border-radius:10px;background:#eeeeee;cursor:pointer;}
button:active{transform:scale(0.95);}
.orange{background:#ff9800;color:white;}
.blue{background:#2196f3;color:white;}
.green{background:#4caf50;color:white;}
.red{background:#f44336;color:white;}
.purple{background:#9c27b0;color:white;}
.equal{width:100%;background:#2196f3;color:white;height:55px;font-size:22px;border-radius:12px;border:none;font-weight:bold;margin-top:5px;}
</style>
</head>
<body>

<h1>📐 SUMANTH Trig Calculator 📐</h1>
<p>Sin, Cos, Tan kuda undi!</p>

<div class="calc">
  <input id="display" readonly placeholder="0">
  <div class="row">
    <button class="purple" onclick="trig('sin')">sin</button>
    <button class="purple" onclick="trig('cos')">cos</button>
    <button class="purple" onclick="trig('tan')">tan</button>
    <button class="blue" onclick="addVal('3.14159')">π</button>
  </div>
  <div class="row">
    <button class="purple" onclick="trig('asin')">sin⁻¹</button>
    <button class="purple" onclick="trig('acos')">cos⁻¹</button>
    <button class="purple" onclick="trig('atan')">tan⁻¹</button>
    <button class="blue" onclick="addVal('**2')">x²</button>
  </div>
  <div class="row">
    <button class="blue" onclick="doSqrt()">√</button>
    <button onclick="addVal('(')">(</button>
    <button onclick="addVal(')')">)</button>
    <button class="red" onclick="clearAll()">C</button>
  </div>
  <div class="row">
    <button onclick="addVal('7')">7</button>
    <button onclick="addVal('8')">8</button>
    <button onclick="addVal('9')">9</button>
    <button class="orange" onclick="addVal('/')">÷</button>
  </div>
  <div class="row">
    <button onclick="addVal('4')">4</button>
    <button onclick="addVal('5')">5</button>
    <button onclick="addVal('6')">6</button>
    <button class="orange" onclick="addVal('*')">×</button>
  </div>
  <div class="row">
    <button onclick="addVal('1')">1</button>
    <button onclick="addVal('2')">2</button>
    <button onclick="addVal('3')">3</button>
    <button class="orange" onclick="addVal('-')">-</button>
  </div>
  <div class="row">
    <button onclick="addVal('0')">0</button>
    <button onclick="addVal('.')">.</button>
    <button class="green" onclick="del()">⌫</button>
    <button class="orange" onclick="addVal('+')">+</button>
  </div>
  <button class="equal" onclick="calculate()">= ANSWER =</button>
  <p style="font-size:13px;color:#666;">sin, cos ante Degrees lo! Ex: sin(30) = 0.5</p>
</div>

<script>
function addVal(v){ document.getElementById("display").value += v; }
function clearAll(){ document.getElementById("display").value = ""; }
function del(){ let d=document.getElementById("display"); d.value=d.value.slice(0,-1); }
function calculate(){
  let d=document.getElementById("display");
  try{ d.value = eval(d.value); }catch(e){ d.value="Tapu! Malli Try Cheyyi"; }
}
function doSqrt(){
  let d=document.getElementById("display");
  try{ d.value = Math.sqrt(eval(d.value)); }catch(e){ d.value="Tapu!"; }
}
function trig(type){
  let d=document.getElementById("display");
  let val = parseFloat(d.value);
  if(isNaN(val)){ d.value="Number Kottu!"; return; }
  let rad = val * Math.PI / 180;
  let ans = 0;
  if(type=='sin') ans = Math.sin(rad);
  if(type=='cos') ans = Math.cos(rad);
  if(type=='tan') ans = Math.tan(rad);
  if(type=='asin') ans = Math.asin(val) * 180 / Math.PI;
  if(type=='acos') ans = Math.acos(val) * 180 / Math.PI;
  if(type=='atan') ans = Math.atan(val) * 180 / Math.PI;
  d.value = Math.round(ans*10000)/10000;
}
</script>

</body>
</html>
